# The one door into Markova.
#
# Everything from a browser arrives here: TLS ends, the dashboard is served,
# and API calls are shared out across the API instances behind it.
#
# Three jobs, in order of how often they matter:
#
#   1. Share the load. Three API instances, and one that stops answering is
#      taken out of rotation rather than continuing to receive a third of the
#      school's traffic.
#   2. Absorb the obvious floods before they cost anything. The application's
#      own rate limits are per user and per route and cost a Redis round trip;
#      these are per address and cost nothing, so they are the cheap first line.
#   3. Terminate TLS in one place instead of three.

worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # The request id, generated here when the client did not send one, passed to
  # the API and logged with the response. It is what makes one request
  # followable across three instances: the browser sees it on the response, the
  # log line here has it, and so does the line in whichever instance answered.
  map $http_x_request_id $request_id_final {
    default   $http_x_request_id;
    ''        $request_id;
  }

  log_format traced '$remote_addr [$time_local] "$request" $status '
                    '$body_bytes_sent rt=$request_time '
                    'upstream=$upstream_addr ut=$upstream_response_time '
                    'id=$request_id_final';
  access_log /var/log/nginx/access.log traced;

  # ── flood control ─────────────────────────────────────────────────────────
  #
  # Per address, and generous: a school shares an address, so a whole staffroom
  # behind one office connection is one client from here. These are sized to
  # stop a script, not to shape normal use. The per-user limits that do the
  # careful work live in the application.
  limit_req_zone  $binary_remote_addr zone=general:10m rate=30r/s;
  # Ten a minute on the credential routes, matching the application's own cap,
  # so an attacker is stopped before it costs a Redis lookup and a bcrypt.
  limit_req_zone  $binary_remote_addr zone=login:10m   rate=10r/m;
  limit_conn_zone $binary_remote_addr zone=conns:10m;

  # ── the API instances ─────────────────────────────────────────────────────
  #
  # least_conn rather than round robin: these requests are not the same size.
  # A register submission and a report card render differ by an order of
  # magnitude, and round robin keeps feeding an instance that is already busy
  # with the expensive one.
  upstream api {
    least_conn;
    server api-1:3000 max_fails=3 fail_timeout=15s;
    server api-2:3000 max_fails=3 fail_timeout=15s;
    server api-3:3000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  upstream dashboard {
    server web:3001;
    keepalive 16;
  }

  gzip on;
  gzip_types text/plain text/css application/json application/javascript
             application/xml image/svg+xml;
  gzip_min_length 1024;

  server {
    listen 80;
    server_name _;

    client_max_body_size 25m;
    limit_conn conns 64;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-Id      $request_id_final;
    proxy_set_header Connection        "";

    # ── failing over ────────────────────────────────────────────────────────
    #
    # Set here rather than in one location, because the routes that most need
    # it are the credential ones and those live in their own block below. Left
    # to the defaults, a login aimed at a stopped instance waits on nginx's
    # 60s connect timeout before anything retries it, and the person signing in
    # has given up long before.
    #
    # Two seconds is far longer than a healthy instance on the same host ever
    # takes to accept a connection, and short enough that the handful of
    # requests in flight when an instance dies are merely slow. After three
    # such failures the upstream block's `max_fails` takes that instance out
    # for fifteen seconds and the cost stops being paid at all.
    proxy_connect_timeout   2s;
    proxy_next_upstream     error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 3;

    # ── the API ─────────────────────────────────────────────────────────────
    location /api/ {
      limit_req zone=general burst=60 nodelay;
      proxy_pass http://api;

      # A report card render is slow by nature. The default 60s would cut a
      # legitimate one off; anything past this is genuinely stuck.
      proxy_read_timeout 120s;
    }

    # Credential routes get their own bucket. burst=3 with no nodelay means a
    # person who fumbles their password twice is queued rather than refused,
    # and a script is refused.
    location ~ ^/api/auth/(login|verify-otp|resend-otp|request-reset|reset-password) {
      limit_req zone=login burst=3;
      proxy_pass http://api;
    }

    # ── chat ────────────────────────────────────────────────────────────────
    #
    # ip_hash is deliberately not used here. It would pin a browser to one
    # instance and look like it solved the problem, while quietly breaking a
    # rolling restart. The Redis adapter is what makes any instance able to
    # deliver to any socket, and it does it properly.
    location /socket.io/ {
      proxy_pass http://api;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_read_timeout 7d;
      proxy_send_timeout 7d;
    }

    # ── uploaded files ──────────────────────────────────────────────────────
    #
    # Cached here so a class list of thirty photographs does not become thirty
    # trips to an API instance. The security headers are repeated rather than
    # trusted from upstream: this response can be served from cache without the
    # API being involved at all.
    location /uploads/ {
      proxy_pass http://api;
      proxy_cache_valid 200 1h;
      add_header X-Content-Type-Options  "nosniff"                  always;
      add_header Content-Security-Policy "sandbox; default-src 'none'" always;
    }

    # Checked by whatever watches this container. Not logged, or it is most of
    # the log.
    location = /healthz {
      access_log off;
      proxy_pass http://api/api/health/live;
    }

    # ── the dashboard ───────────────────────────────────────────────────────
    location / {
      limit_req zone=general burst=60 nodelay;
      proxy_pass http://dashboard;
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}

name: Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Target environment
        required: true
        type: choice
        options:
          - staging
          - production

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/backend

jobs:
  deploy-backend:
    name: Deploy Backend (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set deployment variables
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            echo "DEPLOY_TAG=latest" >> $GITHUB_ENV
            echo "DEPLOY_HOST=${{ secrets.PROD_HOST }}" >> $GITHUB_ENV
          else
            echo "DEPLOY_TAG=staging" >> $GITHUB_ENV
            echo "DEPLOY_HOST=${{ secrets.STAGING_HOST }}" >> $GITHUB_ENV
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/markova
            docker compose pull backend
            docker compose up -d backend
            docker compose exec -T backend npx prisma migrate deploy
            sleep 5
            curl -f http://localhost:3000/api/health || exit 1
            echo "Deploy successful"

      - name: Verify health
        run: |
          sleep 10
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            curl -f ${{ secrets.PROD_URL }}/api/health || exit 1
          else
            curl -f ${{ secrets.STAGING_URL }}/api/health || exit 1
          fi

  deploy-mobile:
    name: Deploy Mobile (${{ github.event.inputs.environment }})
    runs-on: ubuntu-latest
    environment: ${{ github.event.inputs.environment }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build and submit
        working-directory: mobile
        run: |
          if [ "${{ github.event.inputs.environment }}" = "production" ]; then
            eas build --platform all --profile production --non-interactive
            eas submit --platform all --non-interactive
          else
            eas build --platform all --profile preview --non-interactive
          fi

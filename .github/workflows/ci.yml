name: CI

on:
  # Only master. Branch pushes are already covered by pull_request, and listing
  # both made every push to a branch with an open PR run the whole suite twice.
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

# A new push supersedes the run already in flight for the same branch.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (typecheck + lint + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markova
          POSTGRES_PASSWORD: password
          POSTGRES_DB: markova
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # The database is called markova, as in a real install: the migration
      # that creates markova_app grants it CONNECT ON DATABASE markova by name.
      # As a real install runs: the app as markova_app, which the row level
      # security holds, and migrations and the seed as the owner. The first
      # migration that needs it creates markova_app.
      DATABASE_URL: postgresql://markova_app:markova_app@localhost:5432/markova
      DIRECT_DATABASE_URL: postgresql://markova:password@localhost:5432/markova
      REDIS_URL: redis://localhost:6379
      # Distinct, and long enough to model the production rules the app checks
      # at boot. See backend/src/config/env.validation.ts.
      JWT_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210fedcba9876543210

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # @nestjs/schedule is on v6, whose peer range covers Nest 11, so a plain
      # `npm ci` resolves. It previously needed --legacy-peer-deps.
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit -p tsconfig.json
      - run: npm run lint

      # --coverage so the thresholds in package.json are enforced. They are a
      # ratchet: raise them, never lower them.
      - name: Unit tests
        timeout-minutes: 8
        run: npx jest --silent --coverage

      - run: npx prisma migrate deploy
      # The auth e2e suite signs in as real seeded users, so the database has
      # to hold the demo data first.
      - run: npx prisma db seed

      - name: E2E tests
        timeout-minutes: 8
        run: npm run test:e2e -- --passWithNoTests

  web:
    name: Web (typecheck + lint + tests + build)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      # Coverage is enforced, not just reported. The thresholds live in
      # vitest.config.ts and are meant to ratchet upward, never down.
      - run: npx vitest run --coverage
      - run: npm run build

  # Drives the real browser against the real API. This is the gate that catches
  # what unit tests cannot: a route guard that stopped guarding, a form that
  # stopped saving, an accessible name that went missing. It also catches the
  # audit script itself going stale, which is how it silently stopped running
  # for months while still looking green.
  web-e2e:
    name: Web (browser audit + accessibility)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: markova
          POSTGRES_PASSWORD: password
          POSTGRES_DB: markova
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://markova_app:markova_app@localhost:5432/markova
      DIRECT_DATABASE_URL: postgresql://markova:password@localhost:5432/markova
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-access-secret-0123456789abcdef0123456789abcdef
      JWT_REFRESH_SECRET: ci-refresh-secret-fedcba9876543210fedcba9876543210
      NEXT_PUBLIC_API_URL: http://localhost:3000/api
      CORS_ORIGINS: http://localhost:3001
      WEB: http://localhost:3001
      API: http://localhost:3000/api

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            web/package-lock.json

      - name: Install and seed the API
        working-directory: backend
        timeout-minutes: 8
        run: |
          npm ci
          npx prisma generate
          npx prisma migrate deploy
          npx prisma db seed

      # Server output goes to a file rather than the step's own stdout. A
      # background process that keeps the step's pipe open can stop the runner
      # from ever marking the step finished.
      - name: Start the API
        working-directory: backend
        timeout-minutes: 6
        run: |
          npm run build
          node dist/main.js > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health

      - name: Build and start the dashboard
        working-directory: web
        timeout-minutes: 10
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          npx next start -p 3001 > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3001/login && break
            sleep 2
          done
          curl -sf http://localhost:3001/login

      - name: Browser audit
        timeout-minutes: 6
        run: node web/e2e/ui-audit.spec.js

      - name: Accessibility audit
        timeout-minutes: 6
        run: node web/e2e/a11y-audit.spec.js

      - name: Server logs
        if: always()
        run: |
          echo "----- API -----"
          cat /tmp/api.log || true
          echo "----- Dashboard -----"
          cat /tmp/web.log || true

  design-system:
    name: Design system (token drift + contrast + dashes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # The generated theme files must match design/tokens.json, otherwise web
      # and mobile silently drift apart again.
      - run: node scripts/sync-design-tokens.mjs --check
      # Every colour pairing has to stay at WCAG AA.
      - run: node scripts/check-contrast.mjs
      # No em dashes or en dashes anywhere a person writes.
      - run: node scripts/check-dashes.mjs

  security:
    name: Security (dependency advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Lockfiles only. The audit reads the tree that would be installed, and
      # nothing here needs the packages themselves.
      - name: Install lockfiles
        run: |
          npm ci --ignore-scripts --prefix backend || npm install --package-lock-only --prefix backend
          npm ci --ignore-scripts --prefix web || npm install --package-lock-only --prefix web
      # Fails on any advisory that is not written down with a reason. A bare
      # `npm audit` would fail on something with no fix available, somebody
      # would add `|| true`, and it would report nothing from then on.
      - run: node scripts/check-vulnerabilities.mjs

  mobile:
    name: Mobile (typecheck + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      # The thresholds in package.json are a ratchet: raise them, never lower
      # them. They are what stops a screen being added with no test at all.
      - run: npx jest --silent --coverage
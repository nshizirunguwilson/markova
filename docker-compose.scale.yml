# The scaled topology: nginx, three API instances, workers and a pooler.
#
#   docker compose -f docker-compose.yml -f docker-compose.scale.yml \
#     --profile scale up -d --build
#
# A separate file rather than more profiles in the main one, because these are
# two different intents. docker-compose.yml is "run Markova"; this is "run
# Markova the way it is deployed", and the difference is worth being able to
# read in one place.
#
# What this adds over the single-instance stack:
#
#   nginx        one door, TLS, flood control, load sharing
#   api-1..3     stateless replicas, interchangeable
#   worker-1..2  the same image with WORKER=1, so they take PDF work off the
#                queue and the API instances never launch a browser
#   pgbouncer    three pools against one Postgres would exhaust its 100
#                connections; transaction pooling makes them share
#
# The pieces that make this work were already true before any of it was added:
# the API keeps no state in the process, and rate limiting counts in Redis
# rather than in memory. The one thing that had to be built is the socket
# adapter, without which chat would work between two people on the same
# instance and silently fail between two who are not.

x-api-base: &api-base
  build:
    context: ./backend
  restart: unless-stopped
  depends_on:
    pgbouncer:
      condition: service_started
    redis:
      condition: service_healthy
  environment: &api-env
    NODE_ENV: production
    PORT: 3000
    # The school's clock, not the container's. UTC puts a Kigali register two
    # hours out, which lands an early class on the previous day.
    TZ: ${TZ:-Africa/Kigali}
    # Through the pooler, not straight at Postgres. pgbouncer=true tells Prisma
    # to stop using prepared statements, which transaction pooling cannot keep
    # across a connection it hands to somebody else mid-transaction.
    # markova_app, not the owner: a superuser bypasses every row level
    # security policy, so connecting as one would silently undo the isolation.
    DATABASE_URL: postgresql://markova_app:markova_app@pgbouncer:6432/markova?pgbouncer=true&connection_limit=10
    # Migrations need the owner, and they do not go through the pooler:
    # transaction pooling cannot hold the session state a migration needs.
    DIRECT_DATABASE_URL: postgresql://markova:password@postgres:5432/markova
    REDIS_URL: redis://redis:6379
    CORS_ORIGINS: http://localhost
    APP_URL: http://localhost
    JWT_SECRET: ${JWT_SECRET:-change-me}
    JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
    # Student numbers carry an HMAC signed with this. Required in
    # production: without it a number can be forged, and the API refuses
    # to start rather than issue numbers that mean nothing.
    STUDENT_ID_SECRET: ${STUDENT_ID_SECRET:-}
    UPLOAD_DIR: ./uploads
    # There are three proxies' worth of hops in front now. Left unset, every
    # request looks like it came from nginx and the whole school shares one
    # rate limit bucket.
    TRUST_PROXY: '1'
  volumes:
    - uploads:/app/uploads
  healthcheck:
    test: ['CMD', 'node', '-e', "require('http').get('http://localhost:3000/api/health/live',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 3
    start_period: 30s

services:
  # The dashboard, built to talk to the API through nginx rather than straight
  # at a port. NEXT_PUBLIC_API_URL is baked in at build time, so it is an arg.
  web:
    profiles: ['scale']
    build:
      context: ./web
      args:
        NEXT_PUBLIC_API_URL: http://localhost/api
    container_name: markova-web
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Africa/Kigali}
    # Nothing published. Everything reaches the dashboard through nginx on
    # port 80, so publishing 3001 as well would be a second door into the same
    # room with none of the flood control on it.
    #
    # `!reset` rather than an empty list: Compose merges sequences, so
    # `ports: []` leaves the base file's mapping in place. That collided with a
    # developer's own dev server on 3001 and failed the whole stack with
    # "address already in use", which reads as a machine problem rather than a
    # configuration one.
    ports: !reset []

  nginx:
    profiles: ['scale']
    image: nginx:1.27-alpine
    container_name: markova-nginx
    restart: unless-stopped
    depends_on: [api-1, api-2, api-3, web]
    ports:
      - '80:80'
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx

  api-1:
    <<: *api-base
    profiles: ['scale']
    container_name: markova-api-1
    networks:
      default:
        ipv4_address: 172.28.1.1

  api-2:
    <<: *api-base
    profiles: ['scale']
    container_name: markova-api-2
    networks:
      default:
        ipv4_address: 172.28.1.2

  api-3:
    <<: *api-base
    profiles: ['scale']
    container_name: markova-api-3
    networks:
      default:
        ipv4_address: 172.28.1.3

  # The workers run the same image with WORKER=1, which is the only thing that
  # registers the render processor. An API instance therefore never starts a
  # Chrome page, which is the entire point: a class of report cards cannot make
  # the dashboard slow for the people using it.
  worker-1: &worker
    <<: *api-base
    profiles: ['scale']
    container_name: markova-worker-1
    environment:
      <<: *api-env
      WORKER: '1'
      # Two pages at a time. Each is a Chrome compositor and memory runs out
      # before CPU does; past a handful the box swaps and every render slows
      # down, including the ones already in flight.
      RENDER_CONCURRENCY: '2'
    ports: !reset []
    healthcheck:
      disable: true

  worker-2:
    <<: *worker
    container_name: markova-worker-2

  # Three instances open three Prisma pools, and Postgres allows 100
  # connections in total. Transaction pooling lets them share a much smaller
  # set: a connection is held for the length of a transaction rather than the
  # length of a request.
  pgbouncer:
    profiles: ['scale']
    image: edoburu/pgbouncer:latest
    container_name: markova-pgbouncer
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_HOST: postgres
      DB_PORT: '5432'
      # The application role, matching what the API connects as. pgbouncer
      # authenticates its clients itself, so a user it does not know is
      # refused before Postgres is ever asked: the API reported "can't reach
      # the database" for what was actually a rejected login.
      #
      # Migrations do not come through here at all. They use
      # DIRECT_DATABASE_URL straight to Postgres as the owner, because
      # transaction pooling cannot hold the session state a migration needs.
      DB_USER: markova_app
      DB_PASSWORD: markova_app
      DB_NAME: markova
      # Stated rather than assumed. This image listens on 5432 by default,
      # which is the same port as Postgres itself and reads as a typo next to
      # it in a connection string. 6432 is the pgbouncer convention, and the
      # API's DATABASE_URL says 6432: left at the default they disagreed, and
      # the API reported "can't reach the database" for a closed port.
      LISTEN_PORT: '6432'
      POOL_MODE: transaction
      MAX_CLIENT_CONN: '500'
      DEFAULT_POOL_SIZE: '25'
      AUTH_TYPE: scram-sha-256

volumes:
  nginx_cache:

# ── addressing ──────────────────────────────────────────────────────────────
#
# nginx resolves the names in its `upstream` block once, when it loads its
# configuration, and never again. Open source nginx has no way to re-resolve
# them. With addresses handed out on demand that is a silent fault: restart an
# instance, Docker gives it a free address, and nginx goes on sending a third
# of the school's traffic to the address it learned at startup.
#
# It was not theoretical. api-2 was restarted, came back on a new address, and
# Docker gave its old one to a worker. nginx then sent a third of every request
# to a container that exists to render PDFs, api-2 sat idle, and both looked
# healthy the whole time. A failover test passed for the wrong reason: the
# instance being stopped was one nginx had already stopped talking to.
#
# So the three instances nginx names by hand get fixed addresses, and
# `ip_range` confines everything allocated on demand to .5.x, which cannot
# collide with them. Restarting an instance now returns it to the address
# nginx is holding, and nginx never needs restarting to find it.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          ip_range: 172.28.5.0/24

# Development infrastructure: Postgres and Redis only.
#
#   docker compose up -d
#
# Ports deliberately avoid the defaults so this cannot collide with another
# Postgres/Redis already running on the machine.
#
# To run the whole stack in containers instead, add the `full` profile:
#
#   docker compose --profile full up -d --build
#
services:
  postgres:
    image: postgres:15
    container_name: markova-postgres
    restart: unless-stopped
    ports:
      - '5434:5432'
    environment:
      POSTGRES_USER: markova
      POSTGRES_PASSWORD: password
      POSTGRES_DB: markova
      # The same clock as the API. A register taken at 07:30 in Kigali must be
      # stored on the day it happened, not on the previous one.
      TZ: ${TZ:-Africa/Kigali}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U markova']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    container_name: markova-redis
    restart: unless-stopped
    ports:
      - '6380:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    profiles: ['full']
    build:
      context: ./backend
    container_name: markova-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      TZ: ${TZ:-Africa/Kigali}
      # The application role, which cannot bypass row level security. The
      # owner is only for migrations, below.
      DATABASE_URL: postgresql://markova_app:markova_app@postgres:5432/markova
      DIRECT_DATABASE_URL: postgresql://markova:password@postgres:5432/markova
      REDIS_URL: redis://redis:6379
      CORS_ORIGINS: http://localhost:3001
      APP_URL: http://localhost:3001
      JWT_SECRET: ${JWT_SECRET:-change-me}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-change-me-too}
      UPLOAD_DIR: ./uploads
    ports:
      - '3000:3000'
    volumes:
      # Uploaded crests, stamps, signatures and photos must outlive the container.
      - uploads:/app/uploads

  web:
    # Both stacks need the dashboard: `full` runs it against one API, `scale`
    # against three behind nginx. Listing only `full` meant the scaled stack
    # referred to a service that was not in the project.
    profiles: ['full', 'scale']
    build:
      context: ./web
      args:
        # Inlined into the client bundle at build time, so it is set here rather
        # than as a runtime environment variable.
        NEXT_PUBLIC_API_URL: http://localhost:3000/api
    container_name: markova-web
    restart: unless-stopped
    # Deliberately no depends_on. The dashboard is a Next.js server: it renders
    # and the browser calls the API, so it does not need the API up to start.
    # It also lets the scaled stack replace one `api` with three without this
    # line pointing at a service that no longer exists.
    ports:
      - '3001:3001'

  # Nightly backup of the database and the uploads.
  #
  # Deliberately part of the stack rather than a host cron job: a backup that
  # depends on somebody's crontab is one that stops when the server is rebuilt,
  # and nobody notices until the day it is needed.
  #
  # It writes into ./backups on the host, which is the same place backup.sh
  # uses by hand, so restore.sh finds either.
  backup:
    profiles: ['full']
    image: postgres:15
    container_name: markova-backup
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: password
      KEEP_DAYS: '30'
      # Where a copy goes so it survives this machine. Unset means the backup
      # exists here only, which survives a dropped table and not the building.
      # {} is replaced with the path of the backup just taken.
      BACKUP_SYNC_CMD: ${BACKUP_SYNC_CMD:-}
    volumes:
      - ./backups:/backups
      - ./backend/uploads:/uploads:ro
    entrypoint: ['/bin/bash', '-c']
    command:
      - |
        echo "Backup loop started. One run a day at 02:00 UTC."
        while true; do
          # Sleep until the next 02:00 rather than every 24h from boot, so a
          # restart does not quietly move the backup to the middle of the day.
          now=$$(date -u +%s)
          next=$$(date -u -d 'tomorrow 02:00' +%s 2>/dev/null || echo $$((now + 86400)))
          sleep $$((next - now))
          stamp=$$(date -u +%Y%m%dT%H%M%SZ)
          target="/backups/$$stamp"
          mkdir -p "$$target"
          if pg_dump -h postgres -U markova -d markova -Fc > "$$target/database.dump.part"; then
            mv "$$target/database.dump.part" "$$target/database.dump"
            tar -czf "$$target/uploads.tar.gz" -C / uploads 2>/dev/null || true
            printf 'taken:     %s\nhost:      container\ndatabase:  markova\n' "$$stamp" \
              > "$$target/MANIFEST"
            if [ -n "$${BACKUP_SYNC_CMD}" ]; then
              cmd="$${BACKUP_SYNC_CMD//\{\}/$$target}"
              if eval "$$cmd"; then
                echo "backup $$stamp ok, copied off site"
              else
                echo "backup $$stamp ok LOCALLY ONLY: the off-site copy failed" >&2
              fi
            else
              echo "backup $$stamp ok (this machine only)"
            fi
          else
            echo "backup $$stamp FAILED" >&2
            rm -rf "$$target"
          fi
          find /backups -mindepth 1 -maxdepth 1 -type d -mtime +$${KEEP_DAYS} \
            -exec rm -rf {} + 2>/dev/null || true
        done

volumes:
  postgres_data:
  redis_data:
  uploads:

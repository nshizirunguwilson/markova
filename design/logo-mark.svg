<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" role="img" aria-label="Markova">
  <!-- Markova mark.
       Badge: 48×48, corner radius 11 (≈23%, the modern app-icon squircle ratio).
       Monogram: one geometric stroke whose middle vertex descends to the
       baseline, the way Poppins draws its own M. Shallower vertices collapse
       into an H below ~20px — this construction was chosen by rendering the
       candidates at 16px and comparing (see design/README.md).
       With 2.25u round caps the glyph's visual box is x 10.25→37.75,
       y 12.75→35.25 — 27.5×22.5 centred on (24,24). -->
  <rect width="48" height="48" rx="11" fill="#1B4F72"/>
  <path d="M12.5 33V15L24 33L35.5 15V33"
        fill="none"
        stroke="#FFFFFF"
        stroke-width="4.5"
        stroke-linecap="round"
        stroke-linejoin="round"/>
</svg>

<?xml version="1.0" encoding="UTF-8"?>
<!--
  Student ID card, front. CR80: 85.6 x 54 mm, 1 unit = 0.1 mm.

  A starting point, not the finished design. Replace it with your own artwork.
  The only contract is the set of element ids listed in docs/STUDENT-ID-CARD.md
  section 10; everything else here is yours to move, restyle or delete.
-->
<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 856 540"
  width="85.6mm"
  height="54mm"
  font-family="Poppins, system-ui, sans-serif"
>
  <defs>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="856" height="540" rx="32" ry="32" />
    </clipPath>
    <clipPath id="photo-clip">
      <rect x="48" y="150" width="200" height="267" rx="12" ry="12" />
    </clipPath>
  </defs>

  <g clip-path="url(#card-clip)">
    <rect x="0" y="0" width="856" height="540" fill="#FFFFFF" />

    <!-- School band -->
    <rect x="0" y="0" width="856" height="112" fill="#1B4F72" />
    <image id="school-logo" x="40" y="26" width="60" height="60" href="" preserveAspectRatio="xMidYMid meet" />
    <text id="school-name" x="120" y="68" fill="#FFFFFF" font-size="30" font-weight="600">School name</text>

    <!-- Photo. The fallback shows only when the student has no photograph. -->
    <g id="student-photo-fallback">
      <rect x="48" y="150" width="200" height="267" rx="12" ry="12" fill="#D6EAF8" />
      <text x="148" y="300" fill="#1B4F72" font-size="64" font-weight="600" text-anchor="middle">--</text>
    </g>
    <image
      id="student-photo"
      x="48"
      y="150"
      width="200"
      height="267"
      href=""
      clip-path="url(#photo-clip)"
      preserveAspectRatio="xMidYMid slice"
    />

    <!-- Identity -->
    <text id="student-name" x="288" y="200" fill="#1E293B" font-size="44" font-weight="600">Student name</text>
    <text id="student-level" x="288" y="248" fill="#475569" font-size="26">Level</text>

    <text x="288" y="316" fill="#475569" font-size="20" letter-spacing="1.5">STUDENT NUMBER</text>
    <text
      id="student-id"
      x="288"
      y="356"
      fill="#1E293B"
      font-size="30"
      font-weight="500"
      font-family="JetBrains Mono, ui-monospace, monospace"
    >STD-0000-000000-000</text>

    <text id="card-validity" x="288" y="404" fill="#475569" font-size="22">Valid to</text>

    <!-- Verification QR. Replaced wholesale; keep the box where you want it. -->
    <g id="qr-code">
      <rect x="628" y="176" width="180" height="180" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
    </g>
    <text x="718" y="382" fill="#475569" font-size="18" text-anchor="middle">Scan to verify</text>

    <rect x="0" y="452" width="856" height="4" fill="#154360" />
  </g>
</svg>
